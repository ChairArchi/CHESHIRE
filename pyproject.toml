[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cheshire"
version = "0.1.0"
description = "Computational Hybrid Exploration for Surface Handling, Iteration & Rule-based Engine"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["compas==2.15.1"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]
mola = ["pythonnet==3.0.5"]
review = ["pyrender==0.1.45", "pillow==11.3.0", "trimesh==5.1.1", "pyglet==2.1.16"]
reference = ["PyMuPDF==1.28.2"]

[tool.setuptools.package-data]
cheshire = ["mola.runtimeconfig.json"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
